<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 220px;
      font-family: Arial, sans-serif;
      padding: 12px;
      background: #1e1e2e;
      color: #cdd6f4;
      margin: 0;
    }
    h3 { margin-top: 0; color: #89b4fa; text-align: center; }
    .control-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; margin-bottom: 4px; }
    input[type="range"] { width: 100%; accent-color: #89b4fa; }
    button {
      width: 100%;
      padding: 8px;
      background: #a6e3a1;
      border: none;
      color: #11111b;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #94e2d5; }
  </style>
</head>
<body>
  <h3>Gravity Core</h3>
  
  <div class="control-group">
    <label id="grav-label">Gravity Strength: 0.6</label>
    <input type="range" id="gravity-slider" min="0" max="2" step="0.1" value="0.6">
  </div>

  <div class="control-group">
    <label id="bounce-label">Bounciness: 0.45</label>
    <input type="range" id="bounce-slider" min="0" max="0.9" step="0.05" value="0.45">
  </div>

  <button id="trigger-btn">Unleash Gravity</button>
  <script src="popup.js"></script>
</body>
</html>
