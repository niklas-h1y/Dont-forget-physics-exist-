<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 160px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 10px;
      margin: 0;
      background: #0d1117;
      color: #c9d1d9;
    }
    h3 {
      font-size: 14px;
      margin: 0 0 10px 0;
      color: #58a6ff;
    }
    button {
      width: 100%;
      background-color: #238636;
      border: 1px solid rgba(240,246,252,0.1);
      color: white;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
    }
    button.disabled {
      background-color: #da3637;
    }
  </style>
</head>
<body>
  <h3>GitPhysics</h3>
  <button id="toggleBtn">Engine Status: ON</button>
  <script src="popup.js"></script>
</body>
</html>
